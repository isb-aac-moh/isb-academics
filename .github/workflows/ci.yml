name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # eslint.config.js now exists, so this runs. It fails the build on errors and
      # prints warnings without failing — the React Compiler rules in react-hooks v7
      # are warnings here on purpose; see the comment in eslint.config.js.
      - run: npm run lint

      # `build` runs `tsc -b` first, so this also typechecks.
      - run: npm run build
